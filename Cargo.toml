[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters-sqlite",
    "crates/adapters-common",
    "crates/adapters-macos",
    "crates/adapters-windows",
    "crates/adapters-linux",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
adapters-common = { path = "crates/adapters-common" }

# select! over signals, IPC commands and ticks in the engine thread (design section 6).
crossbeam-channel = "0.5"

# Typed JSON blobs for per-feature settings (application) and the IPC DTOs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite with the library compiled in, so the app does not depend on the system version (design section 7).
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
