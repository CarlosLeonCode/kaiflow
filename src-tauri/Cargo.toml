[package]
name = "time-track-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri shell for Time Track Copilot: composition root, typed IPC, tray and windows."

[lib]
name = "time_track_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7"

[dependencies]
domain.workspace = true
application.workspace = true
adapters-sqlite = { path = "../crates/adapters-sqlite" }

tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
# Only used from Rust (save dialog for CSV export); no window receives plugin permissions (R6.5).
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel.workspace = true

# Typed IPC. Design pins an RC; rc.25 is the newest and targets Tauri 2.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
application = { workspace = true, features = ["test-fakes"] }
tempfile.workspace = true
