[package]
name = "time-track-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri shell for Time Track Copilot: composition root, typed IPC, tray and windows."

[lib]
name = "time_track_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7"

[dependencies]
domain.workspace = true
application.workspace = true
adapters-sqlite = { path = "../crates/adapters-sqlite" }

tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
# Only used from Rust (save dialog for CSV export); no window receives plugin permissions (R6.5).
tauri-plugin-dialog = "2.8"
# Also Rust-only. Single-instance must be registered first (design section 10).
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.7"
adapters-macos = { path = "../crates/adapters-macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel.workspace = true

# Typed IPC. Design pins an RC; rc.25 is the newest and targets Tauri 2.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Main-thread marker for the AppKit observers wired in `platform.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
application = { workspace = true, features = ["test-fakes"] }
tempfile.workspace = true
