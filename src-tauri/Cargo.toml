[package]
name = "time-track-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri shell for Time Track Copilot: composition root, typed IPC, tray and windows."

[lib]
name = "time_track_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7"

[dependencies]
domain.workspace = true
application.workspace = true
adapters-sqlite = { path = "../crates/adapters-sqlite" }
adapters-common.workspace = true

tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
# Only used from Rust (save and open dialogs for export, backup folder and restore); no window receives plugin permissions (R6.5).
tauri-plugin-dialog = "2.8"
# Also Rust-only. Single-instance must be registered first (design section 10).
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.7"
# Stable 2.x line (3.x is alpha). Rust-only like every plugin: the frontend talks to the
# `update_check` / `update_install` commands, never to the plugin.
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local-day bounds for the tray text (the frontend computes its own in JS).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
crossbeam-channel.workspace = true

# Typed IPC. Design pins an RC; rc.25 is the newest and targets Tauri 2.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# OS adapters, one per platform (`platform.rs` picks them with the same cfg gates).
# Main-thread marker for the AppKit observers wired in `platform.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
adapters-macos = { path = "../crates/adapters-macos" }
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
adapters-windows = { path = "../crates/adapters-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
adapters-linux = { path = "../crates/adapters-linux" }

[dev-dependencies]
application = { workspace = true, features = ["test-fakes"] }
tempfile.workspace = true
