<title>Kaiflow explainer</title>
<!--
  Kaiflow explainer (1920x1080, 34 s, silent, loops seamlessly).

  One continuous piece: a single vermilion drop travels through the whole film while the ink
  morphs from scattered drops into the ensō, unrolls into the day's brush stroke, curls into a
  focus ring, beads into a streak, climbs, and gathers back into the logo, ending exactly on
  the opening frame. A virtual camera (Hermite spline over keyframes) frames everything in a
  single world; paper and foreground specks move at different parallax rates.

  Every frame is a pure function of time: window.__seek(t). render.mjs captures the frames.
  Open this file in a browser to preview it in a loop (?t=12.5 freezes one moment).
  No network and no external files: brand SVGs are inlined, textures come from fixed seeds.
-->
<style>
  :root {
    --paper: #f4efe6; --ink: #17140f; --ink-2: #4a443a; --muted: #857c6f; --vermilion: #e0452b;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    --serif: "New York", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); transform-origin: 0 0; }
  .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #paper { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #whtml { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .w { position: absolute; white-space: nowrap; }
  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.012em; line-height: 1; }
  .word { display: inline-block; will-change: transform, opacity; }
  .glimpse {
    position: absolute; height: 58px; border-radius: 12px; border: 1px solid rgba(23, 20, 15, 0.16);
    background: rgba(255, 255, 255, 0.5); display: flex; align-items: center; gap: 24px; padding: 0 22px;
    font-size: 23px; white-space: nowrap;
  }
  .glimpse .sys { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); flex: none; }
  .glimpse .app { position: relative; font-weight: 650; width: 104px; height: 30px; }
  .glimpse .app span { position: absolute; left: 0; top: 0; }
  .glimpse .menu { color: var(--muted); }
  .glimpse .spacer { flex: 1; }
  .glimpse .item { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
  .glimpse .item svg { width: 26px; height: 26px; }
  #grain { mix-blend-mode: multiply; opacity: 0.45; background-repeat: repeat; }
  #vignette { background: radial-gradient(ellipse 72% 72% at 50% 50%, rgba(23, 20, 15, 0) 58%, rgba(23, 20, 15, 0.04) 100%); }
</style>
</head>

<script>

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  const lerp = (a, b, x) => a + (b - a) * x;
  const L2 = (a, b, x) => [lerp(a[0], b[0], x), lerp(a[1], b[1], x)];
  const eOut = (x) => 1 - Math.pow(1 - x, 3);

  const tremble = (t, t0, amp, freq = 26, decay = 5) => (t < t0 ? 0 : amp * Math.exp(-(t - t0) * decay) * Math.sin((t - t0) * freq));

  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    if (t < 1.2) return [P0[0] + tremble(t, 1.15, 2.5), P0[1] + tremble(t, 1.15, 1.5, 31)];
    if (t < 7.3) return L2(P0, drifted, eSoft(p(t, 2.4, 5.4)));
    if (t < 9.9) { const k = eHit(p(t, 7.3, 8.12)); const q = L2(drifted, P0, k); return [q[0] + tremble(t, 8.12, 3), q[1] + tremble(t, 8.12, 2, 31)]; }
    if (t < 11.0) { const u0 = L2(ringPt(0), axisPt(0), unrollK(t, 0)); return L2(P0, u0, eInOut(p(t, 9.9, 10.3))); }
    if (t < 11.3) { const k = eHit(p(t, 11.0, 11.3)); return L2(axisPt(0), [AX0 + 6, DAY_Y], k); }
    if (t < 14.6) return [tipX(t) + 6, DAY_Y + wy(tipX(t) * 0.5) * 2];
    if (t < 15.6) return bez(curlK(t));
    if (t < 19.6) return ringAt(330 * ringFrac(t));
    const gap = [T[0] + Math.cos(deg(135)) * TR, T[1] + Math.sin(deg(135)) * TR];
    if (t < 20.7) { const q = L2(ringAt(330), gap, eHit(p(t, 19.6, 20.15))); return [q[0] + tremble(t, 20.15, 3), q[1]]; }
    if (t < 22.0) { const q = L2(gap, [ROW_X(6), ROW_Y], eOutBack(p(t, 20.7, 21.5))); return [q[0], q[1] + tremble(t, 21.5, 3, 30)]; }
    if (t < 25.6) { const u = CLIMB_U(t); return u <= 0 ? [ROW_X(6), ROW_Y] : L2([ROW_X(6), ROW_Y], sealAtClimb(u), Math.min(1, u * 8)); }
    const top = sealAtClimb(1);
    if (t < 27.6) return [top[0], top[1] + tremble(t, 25.6, 2, 24, 3)];
    const q = L2(top, P0, eHit(p(t, 27.7, 29.36)));
    return [q[0] + tremble(t, 29.36, 3), q[1] + tremble(t, 29.36, 2, 31)];
  }

  // ======================= Frame =======================
  function setT(el, tx) { el.setAttribute("transform", tx); }
  function vis(el, v) { el.setAttribute("opacity", v.toFixed(3)); el.style.visibility = v > 0.001 ? "visible" : "hidden"; }
  function seek(t) {
    const c = camera(t);
    const camSvg = `translate(960 540) rotate(${c.r.toFixed(4)}) scale(${c.z.toFixed(5)}) translate(${(-c.cx).toFixed(2)} ${(-c.cy).toFixed(2)})`;
    $("cam").setAttribute("transform", camSvg);
    $("whtml").style.transform = `translate(960px,540px) rotate(${c.r.toFixed(4)}deg) scale(${c.z.toFixed(5)}) translate(${(-c.cx).toFixed(2)}px,${(-c.cy).toFixed(2)}px)`;

    // Parallax: paper slower, specks faster.
    const bz = 1 + (c.z - 1) * 0.05;
    $("paper").style.transform = `translate(960px,540px) rotate(${(c.r * 0.5).toFixed(3)}deg) scale(${bz.toFixed(4)}) translate(${(-1400 - c.cx * 0.1).toFixed(1)}px,${(-850 - c.cy * 0.1).toFixed(1)}px)`;
    const zf = Math.pow(c.z, 0.6);
    FG.forEach((s) => {
      const wx = ((((s.x - c.cx * s.rate) % 2800) + 2800) % 2800) - 1400, wy2 = ((((s.y - c.cy * s.rate) % 1700) + 1700) % 1700) - 850;
      s.el.setAttribute("transform", `translate(${f1(960 + wx * zf)} ${f1(540 + wy2 * zf)})`);
    });

    // Subtle directional motion blur from camera velocity.
    const c2 = camera(t + 1 / FPS), s2 = toScreen(c2, c.cx, c.cy), vx = s2[0] - 960, vy = s2[1] - 540;
    const sp = Math.hypot(vx, vy);
    // Only real whip moves get blur; steady tracking stays sharp so the copy and UI stay legible.
    if (sp > 14) { const k = 0.12 * clamp((sp - 14) / 10); $("mbg").setAttribute("stdDeviation", `${Math.min(5, Math.abs(vx) * k).toFixed(2)} ${Math.min(5, Math.abs(vy) * k).toFixed(2)}`); $("camwrap").style.filter = "url(#mb)"; }
    else $("camwrap").style.filter = "none";

    // Film grain: one static tile, offset every other frame.
    const fr = Math.floor(t * 15 + 1e-6), h = rng(fr * 7919 + 13); // grain at 15 fps keeps the bitrate sane
    $("grain").style.backgroundPosition = `${Math.floor(h() * 256)}px ${Math.floor(h() * 256)}px`;

    // --- Ensō (mark): beat 2 and the close ---
    const sweep = ensoSweep(t);
    $("wedge").setAttribute("d", wedgePath(sweep));
    const drawing = t < 20 ? p(t, 6.0, 7.9) : p(t, 28.2, 29.25);
    $("wetwedge").setAttribute("d", drawing > 0 && drawing < 1 ? wedgePath(Math.min(22, sweep), A0 + sweep - Math.min(22, sweep)) : drawing >= 1 ? wedgePath(sweep) : "");
    const wetFade = t < 20 ? 1 - p(t, 7.9, 8.8) : 1 - p(t, 29.25, 30.1);
    $("wetwedge").setAttribute("opacity", wetFade.toFixed(3));
    const ensoV = t < 20 ? (t < 6 ? 0 : 1 - p(t, 9.55, 9.85)) : (t < 28.2 ? 0 : 1 - eSoft(p(t, 32.5, 33.5)));
    vis($("enso"), ensoV);
    const endWash = eSoft(p(t, 32.5, 33.5));
    const wordV = eOut(p(t, 29.7, 30.7)) * (1 - endWash);
    vis($("word"), wordV);
    $("word").style.webkitMaskImage = "none";
    $("word").setAttribute("transform", `translate(${f1(-300 + (1 - eOut(p(t, 29.7, 30.7))) * 30)} -314.4) scale(5.4857) translate(132 78.5)`);
    const tagK = eOut(p(t, 30.4, 31.3));
    vis($("tagline"), tagK * (1 - endWash));
    $("tagline").setAttribute("y", f1(430 + (1 - tagK) * 16));

    // --- Opening drops -> ring ---
    const dropsOn = t < 8.5;
    DROPS.forEach((d) => {
      if (!dropsOn) { vis(d.el, 0); return; }
      const land = p(t, d.land, d.land + 0.18), sc0 = land <= 0 ? 0 : lerp(1.7, 1, eOut(land));
      const spread = eSoft(p(t, 2.4, 5.4)) * d.drift;
      const free = [d.base[0] + d.dir[0] * spread, d.base[1] + d.dir[1] * spread];
      const rel = d.ta - A0, gs = 5.0 + (rel / 360) * 0.9, gq = eInOut(p(t, gs, gs + 1.0));
      const x = lerp(free[0], d.target[0], gq) + tremble(t, d.land + 0.18, 2.5), y = lerp(free[1], d.target[1], gq);
      const thin = 1 - 0.45 * eSoft(p(t, 2.6, 5.4)) * (1 - gq);
      const absorb = 1 - clamp((sweep - rel) / 24);
      setT(d.el, `translate(${f1(x)} ${f1(y)}) rotate(${f1(d.rot * (1 - gq))}) scale(${(sc0 * lerp(1, 0.7, gq)).toFixed(3)})`);
      vis(d.el, (land > 0 ? Math.min(1, land * 3) : 0) * thin * absorb * d.op);
    });
    splOpen.forEach((s) => animSplat(s, t, (1 - eSoft(p(t, 4.6, 6.0)))));
    animSplat(splSeal1, t, t < 8.1 ? 0 : 1 - eSoft(p(t, 9.6, 10.4)));

    // --- Unroll into the axis, ticks ---
    const procOn = t >= 9.55 && t < 28.6;
    if (procOn) {
      const u = unrolled(t);
      $("proc").setAttribute("d", brush(u.pts, u.half));
      $("procBleed").setAttribute("d", t < 11.6 ? brush(u.pts, u.half, 2.5) : "");
    }
    const wash = eSoft(p(t, 27.0, 28.4)); // ink-wash dissolve of the day map
    vis($("proc"), procOn ? Math.min(1, p(t, 9.55, 9.85)) * (1 - wash) * lerp(1, 0.55, p(t, 10.6, 11.4)) : 0);
    vis($("procBleed"), procOn ? p(t, 9.55, 9.85) : 0);
    vis($("ticks"), eOut(p(t, 10.9, 11.6)) * (1 - wash));

    // --- Day stroke ---
    if (t >= 11.3 && t < 28.6) {
      const d = dayStroke(t);
      $("daypath").setAttribute("d", brush(d.cl, d.half));
      $("dayBleed").setAttribute("d", brush(d.cl, d.half, 3));
      const k = Math.min(d.cl.length, 9);
      $("dayWet").setAttribute("d", t < 14.6 ? brush(d.cl.slice(-k), d.half.slice(-k).map((h) => h * 0.9)) : "");
      APPS.forEach(([, color], i) => {
        const start = APPS[i][2], end = i + 1 < APPS.length ? APPS[i + 1][2] : 14.6;
        const a = tipX(start), b = tipX(Math.min(Math.max(t, start), end));
        const seg = $(`seg${i}`); seg.setAttribute("x", f1(a)); seg.setAttribute("width", f1(Math.max(0, b - a + (b > a ? 0.6 : 0))));
        const dry = p(t, end, end + 0.9); // wet ink is lighter; it darkens as it dries
        seg.setAttribute("fill-opacity", lerp(0.78, 1, dry).toFixed(3));
      });
      vis($("day"), 1 - wash);
    } else vis($("day"), 0);
    // Menu bar glimpse rides above the brush with a little lag.
    const gCv = eOut(p(t, 11.5, 12.1)) * (1 - eSoft(p(t, 14.9, 15.5)));
    gC.style.opacity = gCv.toFixed(3); gC.style.visibility = gCv > 0 ? "visible" : "hidden";
    gC.style.left = `${f1(tipX(t - 0.45) - 220)}px`; gC.style.top = `${f1(548 + (1 - eOut(p(t, 11.5, 12.1))) * 20)}px`;
    APPS.forEach(([, , start], i) => {
      const end = i + 1 < APPS.length ? APPS[i + 1][2] : 99;
      const inn = i === 0 ? 1 : eOut(p(t, start + 0.18, start + 0.48)), out = eSoft(p(t, end, end + 0.16));
      const v = i > 0 && t < start ? 0 : inn * (1 - out);
      const el = $(`mb${i}`); el.style.opacity = v.toFixed(3); el.style.transform = `translateY(${((1 - inn) * 8).toFixed(1)}px)`;
    });
    const mins = Math.round(lerp(192, 241, p(t, 11.3, 14.6)));
    $("mbtotal").textContent = `${Math.floor(mins / 60)}h ${mins % 60}m`;

    // --- Curl and focus ring ---
    const ringWash = eSoft(p(t, 20.6, 21.6));
    if (t >= 14.6 && t < 21.7) {
      const ck = curlK(t), cpts = [], chalf = [];
      for (let s = 0; s <= ck; s += 0.02) cpts.push(s);
      if (cpts[cpts.length - 1] < ck) cpts.push(ck);
      $("curl").setAttribute("d", ck > 0.01 ? brush(cpts.map(bez), cpts.map((s) => lerp(7, 11, s) * Math.max(0.3, taper(s, 0.1)) * Math.max(0.3, taper(ck - s, 0.06)))) : "");
      const r = ringStroke(t);
      const on = r.sweep > 0.5;
      $("ring").setAttribute("d", on ? brush(r.cl, r.half) : "");
      $("ringBleed").setAttribute("d", on ? brush(r.cl, r.half, 2.5) : "");
      const k = Math.min(r.cl.length, 10);
      $("ringWet").setAttribute("d", on && t < F1 ? brush(r.cl.slice(-k), r.half.slice(-k).map((h) => h * 0.9)) : "");
      vis($("ringg"), 1 - ringWash);
      setT($("ringg"), `translate(${T[0]} ${T[1]}) scale(${(1 + 0.04 * ringWash).toFixed(4)}) translate(${-T[0]} ${-T[1]})`);
      const rem = remaining(t);
      $("cnum").textContent = `${String(Math.floor(Math.ceil(rem) / 60)).padStart(2, "0")}:${String(Math.ceil(rem) % 60).padStart(2, "0")}`;
      const numV = eOut(p(t, 15.4, 16.0)) * (1 - eSoft(p(t, 20.3, 20.8)));
      vis($("cnum"), numV); vis($("ctask"), numV * 0.9);
      $("ftext").textContent = rem <= 0 ? "◕ 00:00 · Time is up" : `◔ ${$("cnum").textContent} · Write report`;
    } else vis($("ringg"), 0);
    animSplat(splRing, t, t < 20.1 ? 0 : 1);
    const gDv = eOut(p(t, 16.6, 17.3)) * (1 - eSoft(p(t, 20.3, 20.9)));
    gD.style.opacity = gDv.toFixed(3); gD.style.visibility = gDv > 0 ? "visible" : "hidden";
    gD.style.transform = `translateY(${((1 - eOut(p(t, 16.6, 17.3))) * 18).toFixed(1)}px)`;

    // --- Streak, climb, trend ---
    const sweepF = ensoSweep(t);
    STREAK.forEach((d, i) => {
      let pos, sc, v;
      if (i < 6) {
        const a = 20.6 + i * 0.08, k = p(t, a, a + 0.8);
        pos = L2(d.from, d.to, eOutBack(k)); pos[1] += tremble(t, a + 0.8, 3, 30);
        sc = Math.max(0, eOutBack(p(t, a, a + 0.4))); v = t >= a ? 1 : 0;
      } else { pos = d.to.slice(); sc = Math.max(0, eOutBack(p(t, 22.05, 22.4))); v = t >= 22.05 ? 1 : 0; }
      gatherAndDraw(d, t, pos, sc, v * 0.95, sweepF);
    });
    const cu = CLIMB_U(t);
    CLIMB.forEach((d) => {
      const born = cu >= d.u, tb = born ? 22.0 + 3.6 * invEInOut(d.u) : 99;
      const k = p(t, tb, tb + 0.35), sc = Math.max(0, eOutBack(k));
      const pos = L2(sealAtClimb(d.u), d.pos, eOut(k)); pos[1] += tremble(t, tb + 0.35, 2, 30);
      gatherAndDraw(d, t, pos, sc, born ? d.op : 0, sweepF);
    });
    const tk = eInOut(p(t, 23.2, 26.0));
    if (tk > 0 && t < 28.6) {
      const n = Math.floor(tk * 80), pts = [], half = [];
      for (let j = 0; j <= n; j++) { const c3 = climbAt(j / 80); pts.push([c3[0], c3[1] + 30]); }
      pts.forEach((_, j) => half.push(2.4 * Math.max(0.2, taper(j, 5)) * Math.max(0.25, taper(n - j, 4))));
      $("trend").setAttribute("d", pts.length > 1 ? brush(pts, half) : "");
      vis($("trend"), 1 - wash);
    } else vis($("trend"), 0);

    // --- The vermilion drop ---
    const sp2 = sealPos(t);
    let sr = 14.8;
    if (t >= 7.3 && t < 8.12) sr = 14.8 * (1 + 0.12 * Math.sin(Math.PI * p(t, 7.3, 8.12)));
    $("seal").setAttribute("cx", f1(sp2[0])); $("seal").setAttribute("cy", f1(sp2[1])); $("seal").setAttribute("r", sr.toFixed(2));
    $("sealBleed").setAttribute("cx", f1(sp2[0])); $("sealBleed").setAttribute("cy", f1(sp2[1]));
    animSplat(splFinal, t, t < 29.3 ? 0 : 1 - endWash);

    // --- Words ---
    animLine(TXT.a1, t, 3.1, 5.45); animLine(TXT.a2, t, 3.5, 5.55);
    animLine(TXT.b1, t, 6.3, 9.35, { dx: -0.6, dy: -1 }); animLine(TXT.b2, t, 6.8, 9.45, { dx: -0.6, dy: -1 });
    animLine(TXT.c1, t, 11.6, 14.5, { dx: 1, dy: -0.2 }); animLine(TXT.c2, t, 12.1, 14.6, { dx: 1, dy: -0.2 });
    animLine(TXT.c3, t, 12.9, 15.3, { dx: 1, dy: 0 });
    animLine(TXT.d1, t, 16.3, 20.3, { dx: 0.4, dy: 1 }); animLine(TXT.d2, t, 17.0, 20.4, { dx: 0.4, dy: 1 });
    animLine(TXT.e1, t, 22.4, 25.9, { dx: -0.6, dy: -0.8 }); animLine(TXT.e2, t, 23.0, 26.0, { dx: -0.6, dy: -0.8 });
    // Screen-anchored copy drifts with the camera a little (it tracks, it does not sit still).
    const drift = (c.cx - camera(t - 0.5).cx) * 0.06;
    SH.style.transform = `translate(${(-drift).toFixed(2)}px, 0)`;
  }
  function invEInOut(y) { let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (eInOut(m) < y) lo = m; else hi = m; } return lo; }
  function gatherAndDraw(d, t, pos, sc, v, sweepF) {
    if (t >= 26.9) {
      const rel = d.ta2 - A0, gs = 27.2 + (rel / 360) * 0.7, gq = eInOut(p(t, gs, gs + 1.0));
      pos = L2(pos, d.target2, gq); sc = lerp(sc, 0.8, gq);
      v *= 1 - clamp((sweepF - rel) / 24);
    }
    setT(d.el, `translate(${f1(pos[0])} ${f1(pos[1])}) scale(${sc.toFixed(3)})`);
    vis(d.el, v);
  }

  window.__DURATION = DURATION;
  window.__seek = seek;
  window.__ready = document.fonts ? document.fonts.ready : Promise.resolve();

  const params = new URLSearchParams(location.search);
  if (params.has("render")) { seek(0); return; }
  const stage = $("stage");
  const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`; };
  addEventListener("resize", fit); fit();
  if (params.has("t")) { seek(Number(params.get("t"))); return; }
  const t0 = performance.now();
  const loop = (now) => { seek(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
