name: Release

# Pushing a tag such as v0.2.0 builds Kaiflow and publishes it to a GitHub Release:
#
# - macOS: universal DMG (the primary download).
# - Windows (beta): NSIS installer (.exe) and MSI. Unsigned: SmartScreen warns on first run.
# - Linux (beta): AppImage and .deb, built on Ubuntu 22.04. Unsigned.
#
# Everything is optional and free by default (no paid Apple Developer account):
#
# - macOS signing, in order of preference:
#     1. Developer ID + notarization, when every APPLE_* secret exists.
#     2. A stable self-signed identity, when MACOS_SELF_SIGNED_CERT_P12 and
#        MACOS_SELF_SIGNED_CERT_PASSWORD exist. macOS then keeps the Accessibility permission
#        across updates because the designated requirement does not change.
#     3. Ad-hoc. Users must re-grant Accessibility after each update (the notes say so).
# - Updater: signed updater artifacts (every platform) and one latest.json covering all of them,
#   only when TAURI_SIGNING_PRIVATE_KEY exists and plugins.updater.pubkey is a real key.
#   Otherwise the in-app updater stays off on every platform.
#
# Flow: `prepare` validates the tag, decides the modes and creates ONE draft release. The build
# jobs upload into that release by id (no job creates its own release, so there is no race).
# `publish` writes latest.json from the uploaded signatures and publishes the release only when
# every build succeeded, so `releases/latest` (the updater endpoint) never points at a partial
# or unverified release.
#
# Setup and certificate generation: docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Common name of the self-signed release certificate (mode 2). Override with a repository
  # variable if your certificate uses another name.
  SELF_SIGNED_IDENTITY: ${{ vars.MACOS_SELF_SIGNED_IDENTITY || 'Kaiflow Release' }}
  APP_PATH_IN_APPLICATIONS: /Applications/Kaiflow.app
  ISSUES_URL: https://github.com/CarlosLeonCode/kaiflow/issues

jobs:
  prepare:
    name: Prepare the release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    outputs:
      updater: ${{ steps.config.outputs.updater }}
      signing_mode: ${{ steps.config.outputs.signing_mode }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the release configuration
        id: config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MACOS_SELF_SIGNED_CERT_P12: ${{ secrets.MACOS_SELF_SIGNED_CERT_P12 }}
          MACOS_SELF_SIGNED_CERT_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_CERT_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # 1. The tag must match the app version, otherwise the updater compares wrong versions.
          app_version="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${app_version} in src-tauri/tauri.conf.json."
            exit 1
          fi

          # 2. Updater: on only with a real public key AND the private signing key. The same
          #    decision applies to every platform (each build job writes the matching overrides).
          if grep -q "REPLACE_WITH_" src-tauri/tauri.conf.json || [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            updater="false"
            echo "::notice title=Updater off::No updater key configured. The app is built without automatic updates. See docs/release.md to enable them (free)."
          else
            updater="true"
          fi
          echo "updater=${updater}" >> "$GITHUB_OUTPUT"

          # 3. macOS signing mode.
          apple_missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then apple_missing="${apple_missing} ${name}"; fi
          done
          if [ -z "${apple_missing}" ]; then
            mode="notarized"
          elif [ -n "${MACOS_SELF_SIGNED_CERT_P12}" ] && [ -n "${MACOS_SELF_SIGNED_CERT_PASSWORD}" ]; then
            mode="self-signed"
          else
            mode="adhoc"
          fi
          echo "signing_mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signing mode::${mode}"

          # 4. Release notes with first-open instructions for every platform.
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Install on macOS"
            echo
            echo "1. Download the \`.dmg\` below, open it and drag **Kaiflow** to **Applications**."
            if [ "${mode}" = "notarized" ]; then
              echo "2. Open it from Applications. This build is notarized by Apple, so it opens normally."
            else
              echo "2. Open it once from Applications. macOS will say it cannot verify the developer: this free build is **not notarized by Apple**. Click **Done** (or **Cancel**), then:"
              echo "   - **macOS 15 (Sequoia) or later:** open **System Settings → Privacy & Security**, scroll to **Security**, click **Open Anyway** next to the message about Kaiflow, and confirm with **Open Anyway** and your password."
              echo "   - **macOS 13 and 14:** in Finder, open **Applications**, **right-click** (or Control-click) **Kaiflow**, choose **Open**, then **Open** again in the dialog."
              echo
              echo "   You only need to do this the first time."
              echo
              echo "   <details><summary>Advanced: remove the quarantine flag from Terminal</summary>"
              echo
              echo "   Only if you trust this download. It skips the Gatekeeper check for this app:"
              echo
              echo "   \`\`\`sh"
              echo "   xattr -dr com.apple.quarantine \"${APP_PATH_IN_APPLICATIONS}\""
              echo "   \`\`\`"
              echo "   </details>"
            fi
            echo "3. Grant **Accessibility** when asked (System Settings → Privacy & Security → Accessibility) so window titles are recorded. Without it, only app names are recorded."
            echo
            case "${mode}" in
              adhoc)
                echo "> **Note:** this build is ad-hoc signed. After installing a new version, macOS forgets the Accessibility permission: remove Kaiflow from the Accessibility list with the **−** button and grant it again." ;;
              self-signed)
                echo "> This build is signed with the project's stable self-signed certificate, so the Accessibility permission is kept across updates." ;;
            esac
            echo
            echo "## Windows (beta)"
            echo
            echo "> **Beta:** less tested than the macOS build. Please [report issues](${ISSUES_URL}) with your Windows version."
            echo
            echo "1. Download **\`Kaiflow_${app_version}_x64-setup.exe\`** (recommended: installs for your user, no administrator rights) or the \`.msi\` below. Windows 10 or 11, 64-bit."
            echo "2. The installer is **not code-signed**, so Microsoft Defender SmartScreen may say *Windows protected your PC*. Click **More info → Run anyway**."
            echo "3. Kaiflow lives in the system tray (next to the clock; it may be hidden under the **^** arrow). Window titles are recorded without any extra permission."
            echo
            echo "## Linux (beta)"
            echo
            echo "> **Beta:** less tested than the macOS build. Please [report issues](${ISSUES_URL}) with your distribution, desktop and session type (\`echo \$XDG_SESSION_TYPE\`)."
            echo
            echo "- **AppImage** (any recent distribution):"
            echo
            echo "  \`\`\`sh"
            echo "  chmod +x Kaiflow_*.AppImage"
            echo "  ./Kaiflow_*.AppImage"
            echo "  \`\`\`"
            echo "- **\`.deb\`** (Ubuntu 22.04 or later, Debian 12 or later):"
            echo
            echo "  \`\`\`sh"
            echo "  sudo apt install ./Kaiflow_*.deb"
            echo "  \`\`\`"
            echo
            echo "Kaiflow works fully on **X11** sessions. On **Wayland**, window tracking is unavailable (Wayland does not let apps see the window in front); idle, lock and sleep are still recorded. Choose an X11 session at login (for example *GNOME on Xorg*) for full tracking. On GNOME, the tray icon needs the **AppIndicator** extension (preinstalled on Ubuntu)."
            echo
            echo "## Updates"
            echo
            if [ "${updater}" = "true" ]; then
              echo "Installed copies update themselves (Settings → Updates)."
            else
              echo "Automatic updates are not enabled for this build: download new versions from this page."
            fi
          } > "${notes}"
          echo "notes_file=${notes}" >> "$GITHUB_OUTPUT"

          {
            echo "### Release configuration"
            echo "- macOS signing: **${mode}**"
            if [ "${mode}" != "notarized" ] && [ -n "${apple_missing}" ]; then
              echo "- Notarization skipped (missing:${apple_missing})."
            fi
            echo "- Windows and Linux (beta): **unsigned**"
            echo "- Updater: **${updater}**"
          } >> "$GITHUB_STEP_SUMMARY"

      # One draft release for every build job. Re-running the workflow reuses it.
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.config.outputs.notes_file }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "map(select(.tag_name == \"${GITHUB_REF_NAME}\")) | .[0].id // empty")"
          if [ -z "${id}" ]; then
            id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f name="Kaiflow ${GITHUB_REF_NAME}" \
              -F body=@"${NOTES_FILE}" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
          else
            echo "::notice title=Release exists::Reusing release ${id} for ${GITHUB_REF_NAME}."
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F body=@"${NOTES_FILE}" --silent
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal (${{ github.ref_name }})
    needs: prepare
    runs-on: macos-latest
    env:
      UPDATER: ${{ needs.prepare.outputs.updater }}
      SIGNING_MODE: ${{ needs.prepare.outputs.signing_mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Write the build overrides
        shell: bash
        run: |
          set -euo pipefail
          override="${RUNNER_TEMP}/release-overrides.json"
          if [ "${UPDATER}" = "true" ]; then
            echo '{}' > "${override}"
          else
            # No updater artifacts, and the placeholder key keeps the in-app updater disabled
            # (src-tauri/src/updater.rs) even if a real pubkey is committed without its secret.
            echo '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":"REPLACE_WITH_UPDATER_PUBLIC_KEY"}}}' > "${override}"
          fi
          echo "OVERRIDES=${override}" >> "$GITHUB_ENV"

      # Mode 2: import the self-signed certificate into a temporary keychain. The identity is
      # referenced by its SHA-1 hash, so codesign finds it even though no CA trusts it.
      - name: Import the self-signed release certificate
        if: env.SIGNING_MODE == 'self-signed'
        env:
          MACOS_SELF_SIGNED_CERT_P12: ${{ secrets.MACOS_SELF_SIGNED_CERT_P12 }}
          MACOS_SELF_SIGNED_CERT_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          p12="${RUNNER_TEMP}/release-cert.p12"

          printf '%s' "${MACOS_SELF_SIGNED_CERT_P12}" | base64 --decode > "${p12}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${p12}" -k "${keychain}" -P "${MACOS_SELF_SIGNED_CERT_PASSWORD}" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}" >/dev/null
          # Prepend the temporary keychain to the search list.
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${p12}"

          # Best effort: trust the certificate for code signing. Signing by hash works without it.
          cert="${RUNNER_TEMP}/release-cert.pem"
          security find-certificate -c "${SELF_SIGNED_IDENTITY}" -p "${keychain}" > "${cert}"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "${cert}" \
            || echo "::warning::Could not mark the certificate as trusted; signing by hash anyway."

          hash="$(security find-identity -p codesigning "${keychain}" | grep -F "\"${SELF_SIGNED_IDENTITY}\"" | head -1 | awk '{print $2}')"
          if [ -z "${hash}" ]; then
            echo "::error::No code signing identity named \"${SELF_SIGNED_IDENTITY}\" in MACOS_SELF_SIGNED_CERT_P12. Check the certificate name or set the MACOS_SELF_SIGNED_IDENTITY variable. See docs/release.md."
            exit 1
          fi
          echo "RELEASE_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          echo "SELF_SIGNED_HASH=${hash}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Toolchain version comes from rust-toolchain.toml; both slices are needed for universal.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # Tauri checks whether these variables EXIST, not whether they are empty: an empty
      # APPLE_CERTIFICATE makes it try to import an empty .p12 and fail, and an empty APPLE_ID
      # makes it try to notarize. So they are exported only when the mode really uses them.
      - name: Export signing credentials for this mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_var() {
            local delimiter="EOF_$(openssl rand -hex 8)"
            { echo "$1<<${delimiter}"; printf '%s\n' "$2"; echo "${delimiter}"; } >> "$GITHUB_ENV"
          }
          if [ "${SIGNING_MODE}" = "notarized" ]; then
            export_var APPLE_CERTIFICATE "${APPLE_CERTIFICATE}"
            export_var APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD}"
            export_var APPLE_ID "${APPLE_ID}"
            export_var APPLE_PASSWORD "${APPLE_PASSWORD}"
            export_var APPLE_TEAM_ID "${APPLE_TEAM_ID}"
          fi
          if [ "${UPDATER}" = "true" ]; then
            export_var TAURI_SIGNING_PRIVATE_KEY "${TAURI_SIGNING_PRIVATE_KEY}"
            export_var TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          fi

      - name: Build, sign and upload to the draft release
        id: tauri
        # v0.6.2, pinned by commit.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Always set: the Developer ID identity, the self-signed identity hash, or "-"
          # (ad-hoc). Certificate import and notarization credentials come from the step above,
          # only in notarized mode.
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_MODE == 'notarized' && secrets.APPLE_SIGNING_IDENTITY || (env.SIGNING_MODE == 'self-signed' && env.SELF_SIGNED_HASH || '-') }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json is written once, for every platform, by the publish job.
          includeUpdaterJson: false
          args: --target universal-apple-darwin --config ${{ env.OVERRIDES }}

      - name: Verify the signature
        run: |
          set -euo pipefail
          # Cargo workspace: build output lives in the root target/ directory.
          bundle="target/universal-apple-darwin/release/bundle"
          app="$(find "${bundle}/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "${bundle}/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${app}" && test -n "${dmg}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -dv --verbose=4 "${app}" 2>&1 | grep -E "^(Identifier|Authority|Signature|TeamIdentifier|CodeDirectory)" || true
          {
            echo "### Designated requirement"
            echo "Must stay identical between releases for macOS to keep the Accessibility permission."
            echo '```'
            codesign -d -r- "${app}" 2>&1 | grep -E "^designated" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${SIGNING_MODE}" = "notarized" ]; then
            codesign --verify --strict --verbose=2 "${dmg}"
            codesign -dv --verbose=4 "${app}" 2>&1 | grep -E "flags=.*runtime" # hardened runtime
            spctl --assess --type execute --verbose=4 "${app}"
            xcrun stapler validate "${app}"
          fi

      - name: Remove the temporary keychain
        if: always() && env.RELEASE_KEYCHAIN != ''
        run: security delete-keychain "${RELEASE_KEYCHAIN}" || true

  windows-linux:
    name: ${{ matrix.name }} beta (${{ github.ref_name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: Linux
            # The oldest supported Ubuntu keeps the AppImage and .deb compatible with more
            # distributions (glibc and WebKitGTK are linked dynamically).
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      UPDATER: ${{ needs.prepare.outputs.updater }}
    steps:
      - uses: actions/checkout@v4

      # Same overrides as macOS. Forward slashes on Windows so the Tauri CLI reads the path as is.
      - name: Write the build overrides
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -m "${dir}")"; fi
          override="${dir}/release-overrides.json"
          if [ "${UPDATER}" = "true" ]; then
            echo '{}' > "${override}"
          else
            echo '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":"REPLACE_WITH_UPDATER_PUBLIC_KEY"}}}' > "${override}"
          fi
          echo "OVERRIDES=${override}" >> "$GITHUB_ENV"

      # WebKitGTK, AppIndicator (tray), librsvg and xdo for Tauri; patchelf and FUSE for the
      # AppImage tooling.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev build-essential pkg-config patchelf file libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # Unsigned: no code-signing secrets on Windows or Linux. Only the updater key is used,
      # and only when the updater is on.
      # Same rule as on macOS: export the updater key only when the updater is on, because an
      # empty-but-defined variable is treated as "set".
      - name: Export the updater key when enabled
        if: env.UPDATER == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            delimiter="EOF_$(openssl rand -hex 8)"
            { echo "${name}<<${delimiter}"; printf '%s\n' "${!name}"; echo "${delimiter}"; } >> "$GITHUB_ENV"
          done

      - name: Build and upload to the draft release
        # v0.6.2, pinned by commit.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundles }} --config ${{ env.OVERRIDES }}

  publish:
    name: Publish the release (${{ github.ref_name }})
    # Every build must succeed: the release stays a draft otherwise. Re-run the failed job and
    # this one runs again.
    needs: [prepare, macos, windows-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      UPDATER: ${{ needs.prepare.outputs.updater }}
    steps:
      - name: Check the uploaded assets
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --paginate \
            --jq '.[] | [.id, .name] | @tsv' > "${RUNNER_TEMP}/assets.tsv"
          {
            echo "### Release assets"
            cut -f2 "${RUNNER_TEMP}/assets.tsv" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          missing=""
          for pattern in '\.dmg$' '-setup\.exe$' '\.msi$' '\.AppImage$' '\.deb$'; do
            if ! cut -f2 "${RUNNER_TEMP}/assets.tsv" | grep -Eq -- "${pattern}"; then
              missing="${missing} ${pattern}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::The release is missing assets matching:${missing}"
            exit 1
          fi

      # One manifest for every platform, built from the uploaded .sig files after all builds
      # finished (parallel jobs merging latest.json themselves could overwrite each other).
      # Keys follow tauri-plugin-updater: "<os>-<arch>-<bundle>" first, then "<os>-<arch>".
      - name: Upload the updater manifest (latest.json)
        if: env.UPDATER == 'true'
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/updater"
          mkdir -p "${work}/sigs"
          while IFS=$'\t' read -r id name; do
            case "${name}" in
              *.sig)
                gh api -H "Accept: application/octet-stream" \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "${work}/sigs/${name}" ;;
            esac
          done < "${RUNNER_TEMP}/assets.tsv"

          python3 - "${work}" "${RUNNER_TEMP}/assets.tsv" <<'PY'
          import datetime, json, os, sys, urllib.parse

          work, assets_file = sys.argv[1], sys.argv[2]
          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF_NAME"]
          names = {line.split("\t", 1)[1].strip() for line in open(assets_file) if "\t" in line}

          def arches(name, default):
              lower = name.lower()
              if "universal" in lower:
                  return ["aarch64", "x86_64"]
              if "aarch64" in lower or "arm64" in lower:
                  return ["aarch64"]
              if "x64" in lower or "x86_64" in lower or "amd64" in lower:
                  return ["x86_64"]
              return default

          # (suffix, os, bundle key, also the generic "<os>-<arch>" entry, default arches)
          kinds = [
              (".app.tar.gz", "darwin", "app", True, ["aarch64", "x86_64"]),
              ("-setup.exe", "windows", "nsis", True, ["x86_64"]),
              (".msi", "windows", "msi", False, ["x86_64"]),
              (".AppImage", "linux", "appimage", True, ["x86_64"]),
              (".deb", "linux", "deb", False, ["x86_64"]),
          ]
          platforms = {}
          for sig in sorted(os.listdir(os.path.join(work, "sigs"))):
              artifact = sig[: -len(".sig")]
              if artifact not in names:
                  sys.exit(f"{sig} has no matching asset {artifact}")
              kind = next((k for k in kinds if artifact.endswith(k[0])), None)
              if kind is None:
                  print(f"::warning::Ignoring unknown updater signature {sig}")
                  continue
              _, os_name, bundle, generic, default = kind
              entry = {
                  "signature": open(os.path.join(work, "sigs", sig)).read().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(artifact)}",
              }
              for arch in arches(artifact, default):
                  platforms[f"{os_name}-{arch}-{bundle}"] = entry
                  if generic:
                      platforms[f"{os_name}-{arch}"] = entry

          required = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64"]
          missing = [key for key in required if key not in platforms]
          if missing:
              sys.exit(f"latest.json would miss {missing}: check the updater signatures of each build")

          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": dict(sorted(platforms.items())),
          }
          with open(os.path.join(work, "latest.json"), "w") as out:
              json.dump(manifest, out, indent=2)
          print(json.dumps(manifest["platforms"], indent=2))
          PY

          gh release upload "${GITHUB_REF_NAME}" "${work}/latest.json" --clobber --repo "${GITHUB_REPOSITORY}"
          echo "- Updater manifest: \`latest.json\` with $(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['platforms']))" "${work}/latest.json") platform entries" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
