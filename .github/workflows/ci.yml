name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rust format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt
      # rustfmt ignores cfg, so one OS formats-checks the Windows and Linux adapters too.
      - run: cargo fmt --all --check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # WebKitGTK, AppIndicator (tray), librsvg and xdo for Tauri; Xvfb for the X11 smoke test.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev build-essential pkg-config xvfb
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p time-track-app
      # The ignored X11 test needs a display: a bare Xvfb (no window manager) proves the
      # adapter connects, reads the idle counter and finds no active window without panicking.
      - name: X11 smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test -p adapters-linux -- --ignored
      # bindings.ts is generated by tauri-specta: regenerate it and fail if it differs.
      - name: Bindings are up to date
        if: runner.os == 'Linux'
        run: |
          UPDATE_BINDINGS=1 cargo test -p time-track-app generated_bindings
          git diff --exit-code src/shared/ipc/bindings.ts

  frontend:
    name: Frontend (tsc, ESLint, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The in-memory dev backend (src/dev) must be tree-shaken out of shipped bundles.
      - name: Production bundle has no mock backend
        run: "! grep -rlE 'unmocked command|mockIPC' dist"

  e2e:
    name: E2E (Playwright, mocked IPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
