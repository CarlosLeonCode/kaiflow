name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste window titles or other private data you do not want public.
        Security problems go through a private advisory instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.5, Windows 11 24H2, Ubuntu 24.04 GNOME on Xorg..."
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings > About, or the release you downloaded. Write "source" plus the commit if you built it yourself.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded from GitHub Releases
        - Built from source
        - A fork
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: Accessibility permission (macOS)
      description: System Settings > Privacy & Security > Accessibility.
      options:
        - Granted
        - Not granted
        - Granted, but the app still shows limited tracking
        - Not sure
        - Not applicable (Windows or Linux)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove anything private first.
      render: text
